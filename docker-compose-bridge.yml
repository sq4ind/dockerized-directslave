# ============================================================
# DirectSlave Docker - Bridge Networking Mode
# ============================================================
# Uses Docker's default bridge network with explicit port mappings.
#
# Advantages:
#   - Network isolation between container and host
#   - Port remapping flexibility (e.g., map host 5353 to container 53)
#   - Can run multiple instances on the same host (different ports)
#   - Standard Docker networking model
#
# Disadvantages:
#   - Slight performance overhead due to NAT/iptables
#   - Docker manipulates iptables rules (may conflict with firewall)
#   - Source IP may appear as gateway IP inside container
#
# Usage:
#   docker compose -f docker-compose-bridge.yml up -d
#
# See docs/DOCKER_COMPOSE_NETWORKING.md for detailed explanation.
# ============================================================

services:
  directslave:
    image: ghcr.io/sq4ind/dockerized-directslave:latest
    container_name: directslave
    hostname: directslave

    # Load environment variables from .env file
    env_file: .env

    # Additional environment variables
    environment:
      - TZ=UTC

    # Volume mounts for persistent data
    volumes:
      # DirectSlave configuration and authentication
      - directslave_config:/usr/local/directslave/etc

      # DirectSlave logs
      - directslave_logs:/usr/local/directslave/log

      # DNS zone files
      - directslave_zones:/etc/namedb/secondary

      # Let's Encrypt SSL certificates (persistent across restarts)
      - letsencrypt:/etc/letsencrypt

      # Optional: Mount custom SSL certificates
      # - ./ssl:/usr/local/directslave/ssl:ro

      # Optional: Mount custom scripts
      # - ./custom-scripts:/usr/local/directslave/scripts:ro

    # Port mappings (host:container)
    ports:
      # DirectSlave HTTP interface
      - "2222:2222"

      # DirectSlave HTTPS interface
      - "2224:2224"

      # DNS service (UDP and TCP)
      - "53:53/udp"
      - "53:53/tcp"

      # HTTP port for Let's Encrypt validation
      # Only needed during certificate generation/renewal
      - "80:80"

    # Restart policy
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2222/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Resource limits (optional, adjust as needed)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volumes for data persistence
volumes:
  directslave_config:
    driver: local
  directslave_logs:
    driver: local
  directslave_zones:
    driver: local
  letsencrypt:
    driver: local
