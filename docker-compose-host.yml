# ============================================================
# DirectSlave Docker - Host Networking Mode
# ============================================================
# Uses the host's network stack directly (no NAT, no port mapping).
# This is the RECOMMENDED mode for production DNS servers.
#
# Advantages:
#   - Best DNS query performance (no iptables/NAT overhead)
#   - Container services bind directly to host interfaces
#   - Simplifies firewall rules (no Docker-managed chains)
#   - Required for some EDNS Client Subnet (ECS) use cases
#
# Disadvantages:
#   - No network isolation from host
#   - Port conflicts if host already uses 53, 80, 2222, or 2224
#   - Cannot run multiple instances on the same host
#
# Usage:
#   docker compose -f docker-compose-host.yml build
#   docker compose -f docker-compose-host.yml up -d
#
# See docs/DOCKER_COMPOSE_NETWORKING.md for detailed explanation.
# ============================================================

services:
  directslave:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DIRECTSLAVE_VERSION: "3.5.1"
        DIRECTSLAVE_VARIANT: "advanced-all"
        DIRECTSLAVE_BASE_URL: "https://directslave.com/download"
        # Optional: MD5 checksum for verification (recommended for security)
        # Get from: https://directslave.com/download
        DIRECTSLAVE_MD5: ""
    container_name: directslave
    hostname: directslave

    # Host networking - container shares the host's network namespace.
    # No port mappings needed; services bind directly to host interfaces.
    network_mode: "host"

    # Load environment variables from .env file
    env_file: .env

    # Additional environment variables
    environment:
      - TZ=UTC

    # Volume mounts for persistent data
    volumes:
      # DirectSlave configuration and authentication
      - directslave_config:/usr/local/directslave/etc

      # DirectSlave logs
      - directslave_logs:/usr/local/directslave/log

      # DNS zone files
      - directslave_zones:/etc/namedb/secondary

      # Let's Encrypt SSL certificates (persistent across restarts)
      - letsencrypt:/etc/letsencrypt

      # Optional: Mount custom SSL certificates
      # - ./ssl:/usr/local/directslave/ssl:ro

      # Optional: Mount custom scripts
      # - ./custom-scripts:/usr/local/directslave/scripts:ro

    # Restart policy
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2222/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Resource limits (optional, adjust as needed)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volumes for data persistence
volumes:
  directslave_config:
    driver: local
  directslave_logs:
    driver: local
  directslave_zones:
    driver: local
  letsencrypt:
    driver: local
