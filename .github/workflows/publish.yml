# ============================================================
# Publish Docker Image to GitHub Container Registry (GHCR)
# ============================================================
# Triggers: On git tag push matching v* pattern (e.g., v1.0.0)
# Builds:   Multi-platform (linux/amd64, linux/arm64)
# Registry: ghcr.io/sq4ind/dockerized-directslave
# Tags:     Semver (1.0.0, 1.0, latest)
# Release:  Automatically creates GitHub Release with changelog
# ============================================================

name: Publish

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build and Push Multi-Platform Image
  # ──────────────────────────────────────────────
  publish:
    name: Build & Publish to GHCR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU (multi-platform support)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag: "latest" for every release
            type=raw,value=latest
            # Tag: full semver (e.g., 1.0.0)
            type=semver,pattern={{version}}
            # Tag: major.minor (e.g., 1.0)
            type=semver,pattern={{major}}.{{minor}}
            # Tag: major only (e.g., 1)
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=DirectSlave Docker
            org.opencontainers.image.description=Dockerized DirectSlave DNS server with BIND and automatic SSL via Certbot
            org.opencontainers.image.vendor=sq4ind
            org.opencontainers.image.licenses=MIT

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DIRECTSLAVE_VERSION=3.5.1
            DIRECTSLAVE_VARIANT=advanced-all

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Summary
        run: |
          echo "## Published Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull the image" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # Job 2: Create GitHub Release with Changelog
  # ──────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")

          echo "Current tag: ${CURRENT_TAG}"
          echo "Previous tag: ${PREV_TAG}"

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "${PREV_TAG}..${CURRENT_TAG}" --oneline --no-merges)
          else
            CHANGELOG=$(git log --oneline --no-merges)
          fi

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download SBOM artifact
        uses: actions/download-artifact@v8
        with:
          name: sbom

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }} - Multi-Platform Docker Image"
          body: |
            ## Changelog

            ```
            ${{ steps.changelog.outputs.changelog }}
            ```

            ## Docker Image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.publish.outputs.version }}
            docker pull ghcr.io/${{ github.repository }}:latest
            ```

            **Platforms:** `linux/amd64`, `linux/arm64`
            **Digest:** `${{ needs.publish.outputs.digest }}`
          files: sbom.spdx.json
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Job 3: Set package visibility to public
  # ──────────────────────────────────────────────
  visibility:
    name: Set Package Visibility
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Make package public
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                package_type: 'container',
                package_name: 'dockerized-directslave',
                username: context.repo.owner,
              });
              core.info('Package exists and is accessible');
            } catch (error) {
              core.warning(`Could not verify package visibility: ${error.message}`);
              core.warning('You may need to manually set the package to public in GitHub Settings > Packages');
            }
